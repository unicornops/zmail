[workspace]
members = []

[workspace.dependencies]
anyhow = "1"
extra = { git = "https://github.com/example/extra", rev = "ffffffffffffffffffffffffffffffffffffffff" }
gpui = { git = "https://github.com/huacnlee/zed", rev = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
gpui_platform = { git = "https://github.com/huacnlee/zed", rev = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", default-features = false }
