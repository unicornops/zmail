events {}

http {
  # WebSocket push (RFC 8887) needs the upgrade handshake passed through.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host localhost;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Push streams (event source and WebSocket) must reach the client as
    # they are written, not when a buffer fills.
    proxy_buffering off;

    location / {
      proxy_pass http://james:80;
      sub_filter_once off;
      sub_filter_types application/json;
      sub_filter "http://localhost/" "http://127.0.0.1:4080/";
      sub_filter "ws://localhost/" "ws://127.0.0.1:4080/";
    }
  }
}
