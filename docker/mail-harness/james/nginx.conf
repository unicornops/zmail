events {}

http {
  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host localhost;

    location / {
      proxy_pass http://james:80;
      sub_filter_once off;
      sub_filter_types application/json;
      sub_filter "http://localhost/" "http://127.0.0.1:4080/";
      sub_filter "ws://localhost/" "ws://127.0.0.1:4080/";
    }
  }
}
