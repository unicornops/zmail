# Phase 2b CONDSTORE/QRESYNC harness: a plain-IMAP Dovecot with a single
# static account, used to exercise RFC 7162 incremental flag sync.
listen = *
protocols = imap
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/var/mail/%n
first_valid_uid = 5000

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%n /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/%n
}
