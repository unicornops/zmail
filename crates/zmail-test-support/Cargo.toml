[package]
name = "zmail-test-support"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
zmail-core = { path = "../zmail-core" }
zmail-imap = { path = "../zmail-imap" }
zmail-jmap = { path = "../zmail-jmap" }
zmail-security = { path = "../zmail-security" }
zmail-smtp = { path = "../zmail-smtp" }
zmail-store = { path = "../zmail-store" }
zmail-sync = { path = "../zmail-sync" }

[dev-dependencies]
# Live tests against the Proton harness. `test-harness` lets the client trust
# the harness CA on a loopback URL; it is never enabled outside this crate.
zmail-proton-api = { path = "../zmail-proton-api", features = ["test-harness"] }
# Proton sync tests drive the real sync runtime with Proton support built in.
zmail-proton = { path = "../zmail-proton" }
zmail-sync = { path = "../zmail-sync", features = ["proton"] }

[lints]
workspace = true
