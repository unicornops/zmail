[package]
name = "zmail-ui"
version = "0.0.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
zmail-auth = { path = "../zmail-auth" }
zmail-autodiscover = { path = "../zmail-autodiscover" }
zmail-core = { path = "../zmail-core" }
zmail-notify = { path = "../zmail-notify" }
# The renderer boundary and HTML mail in a web view (ADR 0006); the web
# view is macOS only, a no-op elsewhere.
zmail-render = { path = "../zmail-render" }
zmail-render-web = { path = "../zmail-render-web" }
zmail-security = { path = "../zmail-security" }
zmail-store = { path = "../zmail-store" }
zmail-sync = { path = "../zmail-sync" }
zmail-theme = { path = "../zmail-theme" }
# Proton Mail sign-in (docs/adr/0004-proton-native.md); only with the
# `proton` feature.
zmail-proton = { path = "../zmail-proton", optional = true }

# High contrast (`styles/high_contrast.rs`) and reduced motion
# (`motion.rs`): the platforms' settings, read through safe APIs. Both are
# already in the tree through GPUI.
[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[features]
# The Proton Mail provider in the add-account flow. Off by default, and not
# enabled by zmail-app, until the local store is encrypted at rest (#139).
proton = ["dep:zmail-proton", "zmail-sync/proton"]

[dev-dependencies]
# `#[gpui::test]`, `TestAppContext` and `VisualTestContext` for view tests.
gpui = { workspace = true, features = ["test-support"] }
tokio.workspace = true
# Synthetic mailboxes for the performance runs (`view_tests/perf.rs`).
zmail-test-support = { path = "../zmail-test-support" }

[lints]
workspace = true
