[package]
name = "zmail-ui"
version = "0.0.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
zmail-auth = { path = "../zmail-auth" }
zmail-autodiscover = { path = "../zmail-autodiscover" }
zmail-core = { path = "../zmail-core" }
zmail-notify = { path = "../zmail-notify" }
zmail-security = { path = "../zmail-security" }
zmail-store = { path = "../zmail-store" }
zmail-sync = { path = "../zmail-sync" }
zmail-theme = { path = "../zmail-theme" }

# High contrast (`styles/high_contrast.rs`): the platforms' settings,
# read through safe APIs. Both are already in the tree through GPUI.
[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
# `#[gpui::test]`, `TestAppContext` and `VisualTestContext` for view tests.
gpui = { workspace = true, features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
