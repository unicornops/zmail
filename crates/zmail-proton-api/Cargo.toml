[package]
name = "zmail-proton-api"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Proton Mail API client for Zmail, ported from go-proton-api"

[features]
# Points the client at the local fake Proton server (zmail-test-support only;
# never a zmail-app dependency). Refuses to build in release mode.
test-harness = []

[dependencies]
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
pgp.workspace = true
proton-srp.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls-native-certs.workspace = true
rustls-webpki.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Deterministic SRP proofs for the go-srp and proton-srp test vectors.
proton-srp = { workspace = true, features = ["custom_csprng"] }

[lints]
workspace = true
