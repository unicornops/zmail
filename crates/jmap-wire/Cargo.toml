[package]
name = "jmap-wire"
version = "0.1.0"
description = "A layered JMAP client (RFC 8620, RFC 8621, RFC 8887): a protocol core that asks only for the capabilities a request uses, with replaceable HTTP and WebSocket transports and push"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/unicornops/zmail"
readme = "README.md"
keywords = ["jmap", "email", "rfc8620", "rfc8621"]
categories = ["email", "network-programming", "web-programming::http-client"]
publish = false

[features]
default = ["reqwest", "gzip"]
# Asks for gzip-compressed answers (`Accept-Encoding: gzip`) and
# decompresses them in the client, whatever the transport, with the
# response size limit applied to the decompressed size.
gzip = ["dep:flate2"]
# The default HTTP transport, on reqwest with rustls: the bundled Mozilla
# roots, or a TLS configuration of the caller's. Without it the crate
# is the protocol core alone, for a transport of your own. tokio is here
# for its timer alone: the idle timeout of a streamed response.
reqwest = ["dep:reqwest", "dep:tokio"]
# A WebSocket transport for JMAP over WebSocket (RFC 8887), on
# tokio-tungstenite with rustls: the system's root certificates, or a TLS
# configuration of the caller's. Off
# by default: the WebSocket binding itself (messages, the two traits,
# `Client::connect_websocket`) needs no feature.
tungstenite = ["dep:tokio-tungstenite", "dep:tokio", "dep:futures-util"]

[dependencies]
base64.workspace = true
flate2 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
# With rustls and the bundled Mozilla roots (webpki-roots) for
# `ReqwestTransport::new`; a caller can bring a TLS configuration of its
# own instead (`ReqwestTransport::with_preconfigured_tls`).
reqwest = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
flate2.workspace = true
tokio.workspace = true

[lints]
workspace = true
