[package]
name = "zmail-jmap"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures-util.workspace = true
# `websockets` adds the RFC 8887 push fallback (tokio-tungstenite).
jmap-client = { workspace = true, features = ["websockets"] }
reqwest = { workspace = true, features = ["stream"] }
tokio.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
zmail-core = { path = "../zmail-core" }
zmail-security = { path = "../zmail-security" }
zmail-smtp = { path = "../zmail-smtp" }

[lints]
workspace = true
