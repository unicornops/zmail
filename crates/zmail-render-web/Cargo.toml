[package]
name = "zmail-render-web"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Zmail's web renderer for HTML mail: a locked-down OS web view behind GPUI's native composition (ADR 0006)"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
# Remote images the user allowed are fetched by Zmail, not the engine
# (src/remote.rs): https only, pinned to checked public addresses.
reqwest.workspace = true
url.workspace = true
zmail-render = { path = "../zmail-render" }

# The macOS backend (ADR 0006: objc2 and its AppKit, Foundation and WebKit
# bindings are approved for it). All of its `unsafe` is in
# `src/platform/macos.rs`. raw-window-handle (already in the tree through
# GPUI) reads the window's AppKit view.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "NSTimer", "NSURL", "NSURLError", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentRuleList", "WKContentRuleListStore", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKOpenPanelParameters", "WKPreferences", "WKUIDelegate", "WKURLSchemeHandler", "WKURLSchemeTask", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences", "WKWebsiteDataStore", "WKWindowFeatures"] }
raw-window-handle = "0.6.2"

# The Windows backend (ADR 0006: webview2-com and the `windows` crate GPUI
# already uses, 0.62, are approved for it). All of its `unsafe` is in
# `src/platform/windows.rs`. webview2-com links Microsoft's static WebView2
# loader, so nothing is added to the installer; the runtime is the
# system's evergreen WebView2. The `windows` features are a subset of the
# ones GPUI enables.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The Linux backend (ADR 0006): WebKitGTK 4.1 is loaded at runtime with
# libloading, so Zmail builds without it and starts without it (the reader
# keeps its text view). No gtk-rs or glib crates: they would link the
# libraries at build time. futures-channel carries the engine thread's
# events to a GPUI task. All of its `unsafe` is in `src/platform/linux.rs`.
# raw-window-handle reads the X11 window of GPUI's native surface.
[target.'cfg(target_os = "linux")'.dependencies]
futures-channel = "0.3.34"
libloading = "0.8.9"
raw-window-handle = "0.6.2"

[dev-dependencies]
serde_json.workspace = true

# The canary test runs real web views, which must live on the main thread,
# so it has its own `main` (no libtest harness). It only does anything on
# macOS and Windows.
[[test]]
name = "canary"
harness = false

# The Linux canary: real WebKitGTK views on the engine thread, under a
# display (CI: Xvfb). Its own `main` too, to wait on the engine.
[[test]]
name = "canary_linux"
harness = false

# The workspace lints, except that `unsafe_code` is `deny` rather than
# `forbid`, so the macOS, Windows and Linux platform FFI modules alone can
# allow it.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
