[package]
name = "zmail-tui"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Zmail's terminal UI (ADR 0007)"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
crossterm.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
# The user's keymap file, in the desktop app's JSON keymap format.
serde_json.workspace = true
tokio.workspace = true
unicode-width.workspace = true
url.workspace = true
# Wiping typed passwords (Setup → Accounts) so the optimiser keeps the write.
zeroize.workspace = true
# Triage: the GUI's undoable mail actions (ADR 0007, section 8).
zmail-actions = { path = "../zmail-actions" }
# Setup → Accounts: the GUI's account setup, without its drawing.
zmail-auth = { path = "../zmail-auth" }
zmail-autodiscover = { path = "../zmail-autodiscover" }
zmail-core = { path = "../zmail-core" }
zmail-notify = { path = "../zmail-notify" }
zmail-render = { path = "../zmail-render" }
zmail-security = { path = "../zmail-security" }
zmail-setup = { path = "../zmail-setup" }
zmail-store = { path = "../zmail-store" }
zmail-sync = { path = "../zmail-sync" }
# Proton Mail sign-in (docs/adr/0004-proton-native.md); only with the
# `proton` feature, as in zmail-ui.
zmail-proton = { path = "../zmail-proton", optional = true }

# SIGTERM and SIGHUP: quit as Q does, so the terminal is given back.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
# A fixed store key, so a second test process can open the same store
# (the sync-lock test).
zmail-security = { path = "../zmail-security", features = ["test-fixtures"] }

[features]
# Proton Mail in Setup → Accounts, matching zmail-ui's `proton` feature;
# zmail-app turns both on together.
proton = ["dep:zmail-proton", "zmail-setup/proton", "zmail-sync/proton"]

[lints]
workspace = true
