[package]
name = "zmail-app"
version = "0.15.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Zmail desktop email client"

[package.metadata.deb]
maintainer = "UnicornOps <noreply@unicornops.ie>"
copyright = "2026, UnicornOps"
depends = "libxkbcommon0, libxkbcommon-x11-0, libdbus-1-3, libasound2t64 | libasound2, libfontconfig1, libfreetype6, libvulkan1 | libegl1"
section = "mail"
priority = "optional"
assets = [
    ["target/release/zmail-app", "usr/bin/", "755"],
    ["ie.unicornops.zmail.desktop", "usr/share/applications/", "644"],
    # The bundled Inter font is embedded in the binary; OFL-1.1 asks for
    # its licence to travel with it.
    ["../../assets/fonts/inter/LICENSE.txt", "usr/share/doc/zmail-app/Inter-LICENSE.txt", "644"],
    # The Lucide icons are embedded too; ISC asks for the same.
    ["../../assets/icons/LICENSE.txt", "usr/share/doc/zmail-app/Lucide-LICENSE.txt", "644"],
    # SQLCipher and the OpenSSL it uses are compiled in (ADR 0005); their
    # BSD-3-Clause and Apache-2.0 licences ask for their notices.
    ["../zmail-store/LICENSE-SQLCIPHER", "usr/share/doc/zmail-app/SQLCipher-LICENSE.txt", "644"],
    ["../zmail-store/LICENSE-OPENSSL", "usr/share/doc/zmail-app/OpenSSL-LICENSE.txt", "644"],
]
extended-description = "Zmail is a fast, standards-compliant desktop email client built with GPUI."

[dependencies]
anyhow.workspace = true
chrono.workspace = true
rpassword.workspace = true
url.workspace = true
zmail-assets = { path = "../zmail-assets" }
zmail-auth = { path = "../zmail-auth" }
zmail-core = { path = "../zmail-core" }
zmail-imap = { path = "../zmail-imap" }
zmail-security = { path = "../zmail-security" }
zmail-sync = { path = "../zmail-sync" }
zmail-store = { path = "../zmail-store" }
zmail-theme = { path = "../zmail-theme" }
zmail-ui = { path = "../zmail-ui" }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
