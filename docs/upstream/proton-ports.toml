# Zmail files ported from Proton's upstream repositories.
#
# Each [[port]] maps one Zmail file to the upstream file it follows:
#   repo     = a repository name from the pin table in docs/upstream/proton.md
#   upstream = a path in that repository at the pinned commit; a trailing "/"
#              means every file under that directory
#   local    = the Zmail file, relative to the repository root
#
# The weekly upstream check reports every entry whose upstream path changed
# after the pin. See docs/upstream/proton.md.
#
# Not tracked here: test vectors and key fixtures copied from
# proton-crypto-rs (pinned by Cargo.lock through proton-srp).

