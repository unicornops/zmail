[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std is pulled transitively by the pinned GPUI stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2024-0384", reason = "instant is pulled transitively by the pinned GPUI stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled transitively by the pinned GPUI stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is pulled transitively by the pinned GPUI stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0105", reason = "core2 is pulled transitively by the rav1e/ravif image stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is pulled transitively by the pinned GPUI stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled transitively by the pinned GPUI font stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml is pinned below 0.41 by the wayland/GPUI stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml is pinned below 0.41 by the wayland/GPUI stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is pulled transitively by the pinned GPUI font stack and has no safe repo-local replacement yet" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
