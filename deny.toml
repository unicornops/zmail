[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled transitively by the pinned GPUI macOS stack (metal) and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled transitively by the pinned GPUI font stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is pulled transitively by the pinned GPUI font stack and has no safe repo-local replacement yet" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is pulled transitively by the pinned GPUI Linux accessibility stack (accesskit_unix, atspi) and folds into zbus 6, which that stack does not use yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is pulled transitively by the pinned GPUI Linux accessibility stack (accesskit_unix, atspi) and folds into zbus 6, which that stack does not use yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is pulled transitively by the pinned GPUI Linux accessibility stack (accesskit_unix, atspi) and folds into zbus 6, which that stack does not use yet" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 (via jmap-client -> tokio-tungstenite 0.28) is a shim whose only code is `pub use parent::TLS_SERVER_ROOTS;`, re-exporting webpki-roots 1.x, which Cargo.lock pins to the fixed 1.0.10; there is no newer 0.26.x" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
# Exactly the git repositories the pinned GPUI needs (docs/upstream/zed.md).
# Each revision is fixed by Cargo.lock; keep this list in step with Zed.
allow-git = [
    # GPUI and its platform crates, pinned to a Zed stable release tag.
    "https://github.com/zed-industries/zed",
    # Zed forks GPUI depends on directly (Linux/Windows fonts, X11 input
    # methods, and wasm threads for gpui_web/scheduler on wasm targets).
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/wasm_thread",
    # GPUI's `test-support` feature (zmail-ui dev-dependencies only) pulls
    # the proptest revision Zed pins.
    "https://github.com/proptest-rs/proptest",
    # Mirrors of the [patch.crates-io] entries in Zed's root Cargo.toml.
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/zed-industries/calloop",
]
