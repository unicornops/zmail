#   (https://github.com/zed-industries/zed), Copyright Zed Industries, Inc.,
#   licensed under the Apache License 2.0 (crates/zmail-ui/LICENSE-APACHE).
# - crates/zmail-ui/src/components/title_bar.rs
#   Ported from crates/platform_title_bar in Zed v1.24.2, Copyright Zed
#   Industries, Inc., licensed under GPL-3.0-or-later (used under
#   GPL-3.0-only).
# - crates/zmail-ui/src/components/window_frame.rs
#   Ported from client_side_decorations in crates/workspace (GPL-3.0-or-later,
#   used under GPL-3.0-only) and crates/gpui/examples/window_shadow.rs
#   (Apache License 2.0, crates/zmail-ui/LICENSE-APACHE) in Zed v1.24.2,
#   Copyright Zed Industries, Inc.
#
# Proton Mail support (issue #237, docs/adr/0004-proton-native.md). Every
# file listed in docs/upstream/proton-ports.toml starts with a header naming
# its upstream path, the pinned commit (docs/upstream/proton.md) and the
# licence below.
# - Files ported from go-proton-api (https://github.com/ProtonMail/go-proton-api),
#   Copyright (c) 2020 James Houlahan and Copyright (c) 2022 Proton AG, and
#   from go-srp (https://github.com/ProtonMail/go-srp), Copyright (c) 2019
#   Proton Technologies AG, both licensed under the MIT License
#   (crates/zmail-proton-api/LICENSE-MIT, which ships with that crate).
# - Test vectors and key fixtures in crates/zmail-proton-api (srp_vectors.rs,
#   src/testdata/keys/) from proton-crypto-rs
#   (https://github.com/ProtonMail/proton-crypto-rs), Copyright (c) 2025
#   Proton AG, MIT License (crates/zmail-proton-api/LICENSE-MIT). Tests only;
#   not part of release builds.
# - Files ported from Proton Mail Bridge
#   (https://github.com/ProtonMail/proton-bridge), Copyright (c) Proton AG,
#   licensed under GPL-3.0-or-later (used under GPL-3.0-only), with a dated
#   modification notice in each file.

# Bundled assets that are not crates, also recorded here:
#
# - assets/fonts/inter/Inter-{Regular,Medium,SemiBold,Bold}.ttf
#   Inter 4.1 (https://github.com/rsms/inter/releases/tag/v4.1, from
#   Inter-4.1.zip, sha256 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e),
#   Copyright The Inter Project Authors, licensed under the SIL Open Font
#   License 1.1 (assets/fonts/inter/LICENSE.txt). Embedded in Linux builds
#   only (crates/zmail-ui/src/fonts.rs); the .deb also installs the licence.
# - assets/icons/*.svg (except app-icon.svg)
#   Lucide (https://lucide.dev), licensed under the ISC License; the icons
#   Lucide derives from Feather are also under MIT (assets/icons/LICENSE.txt,
#   copied from the Lucide repository). Embedded in all builds; the .deb also
#   installs the licence.

# C libraries compiled into the binary by crates whose own metadata does
# not name their licence (docs/adr/0005-store-encryption.md):
#
# - SQLCipher (https://www.zetetic.net/sqlcipher/), the encrypted SQLite
#   that libsqlite3-sys bundles for the local store, Copyright (c) 2008-2020
#   Zetetic LLC, licensed under the BSD 3-Clause License
#   (crates/zmail-store/LICENSE-SQLCIPHER). All builds. SQLite itself is in
#   the public domain.
# - OpenSSL 3 (https://www.openssl.org), built from source by openssl-src
#   and linked statically as SQLCipher's crypto library on Linux and
#   Windows, licensed under the Apache License 2.0
#   (crates/zmail-store/LICENSE-OPENSSL). macOS builds use the system's
#   CommonCrypto instead.
# Release archives ship both licences under licenses/ (OpenSSL's only on
# Linux and Windows), and the .deb installs them with the others.

# Third-party code used only by tests, never shipped in a build:
#
# - docker/proton-harness (built in CI by scripts/proton-harness.sh)
#   go-proton-api (https://github.com/ProtonMail/go-proton-api) at
#   8a62023d3e38cb29749bcfc01bf44eafda6cec82, Copyright (c) 2020 James
#   Houlahan and Copyright (c) 2022 Proton AG,
#   licensed under the MIT License. Its fake API server is fetched and
#   built at test time as the Proton API test double;
#   docker/proton-harness/api-port.patch modifies its
#   server/cmd/server/main.go and docker/proton-harness/srp-salt.patch its
#   server/backend/backend.go and api_auth.go; both are under the same MIT
#   licence.
