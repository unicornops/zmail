[workspace]
members = [
    "crates/zmail-app",
    "crates/zmail-assets",
    "crates/zmail-auth",
    "crates/zmail-core",
    "crates/zmail-imap",
    "crates/zmail-index",
    "crates/zmail-jmap",
    "crates/zmail-security",
    "crates/zmail-smtp",
    "crates/zmail-store",
    "crates/zmail-sync",
    "crates/zmail-test-support",
    "crates/zmail-theme",
    "crates/zmail-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false
rust-version = "1.94"
version = "0.0.1"

[workspace.dependencies]
anyhow = "1"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
chrono = "0.4"
futures-util = "0.3"
gpui = { version = "0.2.2" }
jmap-client = { version = "0.4.0", default-features = false, features = ["async", "rustls"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
mail-send = "0.5.2"
mail-parser = "0.11.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.4.0"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls-native-certs = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
url = "2.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
