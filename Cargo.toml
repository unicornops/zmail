[workspace]
members = [
    "crates/zmail-actions",
    "crates/zmail-app",
    "crates/zmail-assets",
    "crates/zmail-auth",
    "crates/zmail-autodiscover",
    "crates/zmail-core",
    "crates/zmail-imap",
    "crates/zmail-index",
    "crates/zmail-jmap",
    "crates/zmail-notify",
    "crates/zmail-proton",
    "crates/zmail-proton-api",
    "crates/zmail-render",
    "crates/zmail-render-web",
    "crates/zmail-security",
    "crates/zmail-smtp",
    "crates/zmail-store",
    "crates/zmail-sync",
    "crates/zmail-test-support",
    "crates/zmail-theme",
    "crates/zmail-tui",
    "crates/zmail-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false
rust-version = "1.98"
version = "0.0.1"

[workspace.dependencies]
# AES-256-GCM in STREAM chunks for the store's attachment files (ADR 0005);
# already in the tree through pgp, which doesn't use `stream`.
aes-gcm = { version = "0.10.3", features = ["stream"] }
# The HTML mail sanitiser (ADR 0006): html5ever's tree builder and an
# allowlist, iterative so deep nesting cannot overflow the stack.
ammonia = "4.2.4"
anyhow = "1"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22.1"
chrono = "0.4"
# The terminal UI's terminal layer (ADR 0007): raw mode, the alternate
# screen, key, mouse and bracketed-paste events on Linux, macOS and Windows
# terminals. The version ratatui's backend uses.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
# CSS tokenizer for the sanitiser's pass over `style` attributes and
# `<style>` blocks (ADR 0006); already in the tree through ammonia.
cssparser = { version = "0.38.0", default-features = false }
futures-util = "0.3"
# GPUI is pinned by commit to the head of Zed PR #62379 ("native window
# composition", from the huacnlee/zed fork) for the macOS web renderer
# (ADR 0006): a deviation from ADR 0003's stable release tags, recorded in
# docs/upstream/zed.md. The weekly `zed-upstream` workflow leaves this pin
# alone until a Zed stable release contains the PR. Keep both lines on the
# same commit.
gpui = { git = "https://github.com/huacnlee/zed", rev = "840e095adddab3b7a644b137c22254fb2d111491" }
gpui_platform = { git = "https://github.com/huacnlee/zed", rev = "840e095adddab3b7a644b137c22254fb2d111491", default-features = false, features = ["font-kit", "wayland", "x11"] }
# SRV and MX lookups for account autodiscovery, through the system's own
# resolver configuration (resolv.conf, the macOS dynamic store, the Windows
# adapters) on the Tokio runtime. No DNS-over-HTTPS/TLS/QUIC transports.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
# HKDF-SHA256 for the store key's subkeys (ADR 0005); already in the tree
# through pgp.
hkdf = "0.12.4"
# The HTML tokenizer the sanitiser's pre-pass and text derivation use
# (ADR 0006); the same release ammonia parses with.
html5ever = "0.40.1"
# HMAC-SHA256 for the store's opaque attachment file names (ADR 0005);
# already in the tree through pgp.
hmac = "0.12.1"
# Exactly 0.4.1: 0.4.2 and later put every capability jmap-client knows
# (contacts, calendars, Sieve, quota, principals...) in each request's
# `using`, which RFC 8620 section 3.6.1 has servers reject
# (`unknownCapability`), and its convenience methods (email_changes,
# email_set_keyword, email_import_account...) build such requests
# internally. 0.4.1 still sends Core and Mail, and already has
# tokio-tungstenite 0.29 (no webpki-roots 0.26, RUSTSEC-2026-0381).
jmap-client = { version = "=0.4.1", default-features = false, features = ["async", "rustls"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# DKIM signing is the sending server's job; leaving out mail-send's default `dkim`
# feature drops mail-auth and its report-parsing dependencies (zip, hickory DNS).
mail-send = { version = "0.6.2", default-features = false, features = ["builder", "cram-md5", "digest-md5", "aws_lc_rs", "tls12"] }
mail-parser = "0.11.2"
# OpenPGP (rPGP) for Proton key handling and the SRP modulus signature, shared
# with ADR 0002. Default features off: no bzip2 (docs/adr/0004-proton-native.md).
# A fork pinned to the head of rpgp/rpgp#573, which moves rPGP to the
# RustCrypto 0.14 stack (crypto-bigint 0.7.6) and so off the crypto-bigint
# 0.5.5 of RUSTSEC-2026-0387. Back to crates.io once a pgp release contains
# #573; see docs/upstream/proton.md.
pgp = { git = "https://github.com/lazzurs/rpgp", rev = "696fe2f437e401f21cac8a1f32f9144a4b95d951", default-features = false }
# Proton's SRP (ADR 0004); the modulus signature is checked with `pgp` in
# zmail-proton-api, so the rPGP-based `pgpinternal` default stays off.
# proton-srp 0.8.4 (the newest release) depends on the crypto-bigint 0.5.5 of
# RUSTSEC-2026-0387, and upstream takes no contributions, so this is 0.8.4
# from a fork ported to crypto-bigint 0.7.6 and rand 0.10 (branch
# `zmail/crypto-bigint-0.7`). Back to crates.io once a proton-srp release
# moves off crypto-bigint 0.5; see docs/upstream/proton.md.
proton-srp = { git = "https://github.com/lazzurs/proton-crypto-rs", rev = "95455e84a43b12124dfd6febac3875d212797038", default-features = false }
rand = "0.8"
# The terminal UI's drawing (ADR 0007), on its crossterm backend; no
# optional widgets or macros.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
# The terminal UI's compose editor (ADR 0007, section 6): the ratatui
# organisation's maintained successor to tui-textarea, on the same
# crossterm backend; no search (regex) or serde.
ratatui-textarea = { version = "0.9.4", default-features = false, features = ["crossterm"] }
# The RNG traits (rand_core 0.10) that `pgp` (since rpgp/rpgp#573) and the
# proton-srp fork take, used only where Zmail hands an RNG to either; already
# in the tree through pgp.
rand_pgp = { package = "rand", version = "0.10", default-features = false, features = ["thread_rng"] }
# Autoconfig XML. Already in the tree through GPUI (usvg); it never fetches
# external entities, and zmail-autodiscover also turns DTDs off.
roxmltree = "0.21.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.11"
rpassword = "7.4.0"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
rustls-native-certs = "0.8.2"
# SPKI extraction for the Proton API pins (zmail-proton-api); already in the
# tree through rustls.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
unicode-segmentation = "1.13"
# Display widths for the terminal UI's truncation and wrapping (ADR 0007);
# already in the tree through ratatui and GPUI.
unicode-width = "0.2.2"
url = "2.5"
zeroize = "1.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Zed's root Cargo.toml patches these crates.io crates, but `[patch]` sections
# only apply to the workspace that declares them, so a git consumer of GPUI
# gets the unpatched crates.io releases unless it repeats the patches. We
# mirror the two that change GPUI's own runtime behaviour: the async-task
# executor (gpui) and the calloop event loop's idle budgeting (gpui_linux).
# Zed's other patches (tree-sitter, livekit, notify, async-process's macOS
# PID adoption, windows-capture) cover crates this build does not compile.
# The `zed-upstream` workflow re-syncs these revisions from the pinned tag.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# Zed's manifest at the #62379 head names calloop without a revision; this
# is the commit its Cargo.lock resolves.
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }
