name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            app_code: ${{ steps.detect.outputs.app_code }}
            workspace_checks: ${{ steps.detect.outputs.workspace_checks }}

        steps:
            - name: Checkout
              if: github.event_name == 'pull_request'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect app code changes
              id: detect
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" != "pull_request" ]]; then
                    echo "app_code=true" >> "$GITHUB_OUTPUT"
                    echo "workspace_checks=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  app_code=false
                  workspace_checks=false
                  while IFS= read -r file; do
                    [[ -z "$file" ]] && continue

                    case "$file" in
                      docker/mail-harness/*)
                        if [[ "$file" != *.md ]]; then
                          workspace_checks=true
                        fi
                        ;;
                      Cargo.toml|Cargo.lock|rust-toolchain.toml)
                        app_code=true
                        workspace_checks=true
                        break
                        ;;
                      crates/*)
                        if [[ "$file" != *.md ]]; then
                          app_code=true
                          workspace_checks=true
                          break
                        fi
                        ;;
                      themes/*)
                        if [[ "$file" != *.md ]]; then
                          app_code=true
                          workspace_checks=true
                          break
                        fi
                        ;;
                      about.toml|deny.toml|scripts/mail-harness.sh)
                        workspace_checks=true
                        ;;
                    esac
                  done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")

                  echo "app_code=$app_code" >> "$GITHUB_OUTPUT"
                  echo "workspace_checks=$workspace_checks" >> "$GITHUB_OUTPUT"

    quality:
        needs: changes
        if: github.event_name != 'pull_request' || needs.changes.outputs.workspace_checks == 'true'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Linux build dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

            # rust-toolchain.toml follows the toolchain Zed pins for the GPUI
            # tag (docs/upstream/zed.md), so CI reads it instead of
            # repeating the version here.
            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}
                  components: rustfmt, clippy

            # The GPUI git dependency clones the whole Zed repository
            # (~400 MB); keep Cargo's git database between runs.
            - name: Cache Cargo git dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/git/db
                  key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-git-${{ runner.os }}-

            - name: Install cargo-deny
              run: cargo install cargo-deny --locked

            - name: Install cargo-audit
              run: cargo install cargo-audit --locked

            - name: Format
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Policy
              run: cargo deny check licenses advisories bans sources

            - name: Advisory audit
              # If an advisory has no upstream fix reachable in the lock,
              # silence it inline with --ignore and link the reason here.
              # The pinned-stack advisories (all "unmaintained" warnings,
              # which cargo audit does not fail on) are listed in deny.toml,
              # which cargo deny enforces alongside in Policy.
              run: cargo audit

            - name: Workspace tests
              run: cargo test --workspace --locked

            - name: Live Mail Harness Test
              # DOCKERHUB_* are optional: the harness script logs in when they
              # are configured, so image pulls use a personal quota instead
              # of the shared anonymous one (issue #88).
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: cargo test -p zmail-test-support --test live_mail_harness -- --ignored --nocapture

            - name: Live JMAP Harness Test
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: cargo test -p zmail-test-support --test live_jmap_harness -- --ignored --nocapture

    build:
        name: Build (${{ matrix.os }})
        needs:
            - changes
            - quality
        if: github.event_name != 'pull_request' || needs.changes.outputs.app_code == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: zmail-linux
                      binary_path: target/release/zmail-app
                    - os: macos-latest
                      artifact_name: zmail-macos
                      binary_path: target/release/zmail-app
                    - os: windows-latest
                      artifact_name: zmail-windows
                      binary_path: target/release/zmail-app.exe

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}

            - name: Cache Cargo git dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/git/db
                  key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-git-${{ runner.os }}-

            - name: Build release binary
              run: cargo build -p zmail-app --release --locked

            - name: Upload release binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.binary_path }}
