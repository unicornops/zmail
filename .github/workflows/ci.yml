name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Linux build dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.94.0
                  components: rustfmt, clippy

            - name: Install cargo-deny
              run: cargo install cargo-deny --locked

            - name: Install cargo-audit
              run: cargo install cargo-audit --locked

            - name: Format
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Policy
              run: cargo deny check licenses advisories bans sources

            - name: Advisory audit
              run: cargo audit

            - name: Workspace tests
              run: cargo test --workspace --locked

            - name: Live Mail Harness Test
              run: cargo test -p zmail-test-support --test live_mail_harness -- --ignored --nocapture

            - name: Live JMAP Harness Test
              run: cargo test -p zmail-test-support --test live_jmap_harness -- --ignored --nocapture

    build:
        name: Build (${{ matrix.os }})
        needs: quality
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: zmail-linux
                      binary_path: target/release/zmail-app
                    - os: macos-latest
                      artifact_name: zmail-macos
                      binary_path: target/release/zmail-app
                    - os: windows-latest
                      artifact_name: zmail-windows
                      binary_path: target/release/zmail-app.exe

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.94.0

            - name: Build release binary
              run: cargo build -p zmail-app --release --locked

            - name: Upload release binary
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.binary_path }}
