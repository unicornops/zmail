name: Release Screenshot

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  linux_screenshot:
    name: Linux Screenshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux build and capture dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev xvfb openbox xdotool imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.94.0

      - name: Build release binary
        run: cargo build -p zmail-app --release --locked

      - name: Capture Linux screenshot
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" bash scripts/capture-release-screenshot.sh artifacts/zmail-linux-screenshot.png

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmail-linux-screenshot
          path: artifacts/zmail-linux-screenshot.png

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/zmail-linux-screenshot.png --clobber

      - name: Upload capture logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmail-linux-screenshot-logs
          path: |
            /tmp/zmail-release-screenshot-app.log
            /tmp/zmail-release-screenshot-openbox.log
          if-no-files-found: ignore
