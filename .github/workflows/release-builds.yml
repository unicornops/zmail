name: Release Builds

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      archive_name: zmail-linux-x86_64
                      binary_path: target/release/zmail-app
                    - os: macos-latest
                      archive_name: zmail-macos
                      binary_path: target/release/zmail-app
                    - os: windows-latest
                      archive_name: zmail-windows-x86_64
                      binary_path: target/release/zmail-app.exe

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.94.0

            - name: Build release binary
              run: cargo build -p zmail-app --release --locked

            - name: Create Unix archive
              if: runner.os != 'Windows'
              run: tar -czf ${{ matrix.archive_name }}.tar.gz -C target/release zmail-app

            - name: Create Windows archive
              if: runner.os == 'Windows'
              shell: pwsh
              run: Compress-Archive -Path target/release/zmail-app.exe -DestinationPath ${{ matrix.archive_name }}.zip

            - name: Upload Unix workflow artifact
              if: runner.os != 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.archive_name }}
                  path: ${{ matrix.archive_name }}.tar.gz

            - name: Upload Windows workflow artifact
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.archive_name }}
                  path: ${{ matrix.archive_name }}.zip

            - name: Upload Unix release asset
              if: github.event_name == 'release' && runner.os != 'Windows'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.archive_name }}.tar.gz" --clobber

            - name: Upload Windows release asset
              if: github.event_name == 'release' && runner.os == 'Windows'
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.archive_name }}.zip" --clobber
