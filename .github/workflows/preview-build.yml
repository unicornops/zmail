name: Preview Build

# Builds a signed, notarized macOS DMG of any branch, tag or commit and
# publishes it as a GitHub pre-release, so work that cannot be merged yet
# (for example a branch that pins GPUI to an unmerged Zed pull request) can
# be installed and tried on a Mac. It never touches the normal releases: the
# pre-release is never marked "Latest", its tag is the preview name (which
# must not look like a release tag), and the app is bundled as "Zmail
# Preview" with its own bundle identifier so it installs next to Zmail.
#
# The signing and notarization steps mirror `build_release_assets` in
# release-please.yml; keep them in step when that job changes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to build"
        required: true
        type: string
      preview_name:
        description: "Pre-release tag and name, e.g. web-preview-1 (letters, digits, '.', '-', '_'; not a version tag)"
        required: true
        type: string
      notes:
        description: "What this preview is for (Markdown); goes at the top of the release notes"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: preview-build-${{ inputs.preview_name }}
  cancel-in-progress: false

jobs:
  build_preview:
    name: Build macOS preview
    runs-on: macos-latest
    steps:
      - name: Check the preview name
        env:
          PREVIEW_NAME: ${{ inputs.preview_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$PREVIEW_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::The preview name may only contain letters, digits, '.', '-' and '_'."
            exit 1
          fi
          # Release tags are vX.Y.Z (release-please-config.json); a preview
          # must never be mistaken for one.
          if [[ "$PREVIEW_NAME" =~ ^v[0-9] ]] || [[ "$PREVIEW_NAME" =~ ^zmail ]]; then
            echo "::error::The preview name must not look like a release tag."
            exit 1
          fi
          if gh release view "$PREVIEW_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release named $PREVIEW_NAME already exists; pick a new preview name."
            exit 1
          fi

      - name: Checkout the preview ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Record the commit and GPUI source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Cargo.lock's source line for gpui names the repository and the
          # exact commit GPUI was built from.
          gpui_source=$(awk '/^name = "gpui"$/ { found = 1; next } found && /^source = / { gsub(/^source = "|"$/, ""); print; exit }' Cargo.lock)
          echo "gpui_source=${gpui_source}" >> "$GITHUB_OUTPUT"
          echo "Building $(git rev-parse HEAD) with GPUI from ${gpui_source}"

      - name: Read the pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Cargo git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git/db
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-git-${{ runner.os }}-

      - name: Build release binary
        run: cargo build -p zmail-app --release --locked

      - name: Set up macOS code signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_BASE64" ]; then
            # Unlike a release, a preview is only useful on another Mac when
            # it is signed and notarized, so missing credentials fail it.
            echo "::error::APPLE_CERTIFICATE_BASE64 is not available to this run; a preview must be Developer ID signed."
            exit 1
          fi

          KEYCHAIN_NAME="zmail-preview.keychain"
          KEYCHAIN_PASSWORD="temporary_password_$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          # The existing search list is split into words on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | sed s/\"//g)

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_NAME" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p' || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application certificate found after import"
            exit 1
          fi

          {
            echo "SIGNING_IDENTITY=$IDENTITY"
            echo "KEYCHAIN_NAME=$KEYCHAIN_NAME"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Developer ID certificate installed"

      - name: Install the icon generation dependency
        run: brew install librsvg

      - name: Generate the app icon
        run: scripts/generate-app-icon.sh target/Zmail.icns

      - name: Create and sign the app bundle
        env:
          PREVIEW_NAME: ${{ inputs.preview_name }}
        run: |
          set -euo pipefail
          bundle="Zmail Preview.app"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zmail-app/Cargo.toml | head -n 1)
          echo "Bundling Zmail Preview ${PREVIEW_NAME} (crate version ${VERSION})"
          mkdir -p "${bundle}/Contents/MacOS" "${bundle}/Contents/Resources"
          cp target/release/zmail-app "${bundle}/Contents/MacOS/Zmail"
          cp target/Zmail.icns "${bundle}/Contents/Resources/Zmail.icns"
          cat > "${bundle}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Zmail</string>
            <key>CFBundleIdentifier</key><string>ie.unicornops.zmail.preview</string>
            <key>CFBundleName</key><string>Zmail Preview</string>
            <key>CFBundleDisplayName</key><string>Zmail Preview</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>Zmail</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${PREVIEW_NAME}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_NAME" --options runtime --timestamp "${bundle}"
          codesign -vvv --deep --strict "${bundle}"

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::APPLE_DEVELOPER_ID, APPLE_APP_PASSWORD or APPLE_TEAM_ID is not available to this run; a preview must be notarized."
            exit 1
          fi

          bundle="Zmail Preview.app"
          ditto -c -k --keepParent "$bundle" NotarizeApp.zip
          AUTH=(--apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD")

          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::Notarization attempt $attempt failed: $*"
              sleep $((attempt * 30))
            done
            return 1
          }
          submit() {
            xcrun notarytool submit NotarizeApp.zip "${AUTH[@]}" --output-format json > submission.json
          }

          retry submit
          SUBMISSION_ID=$(jq -r '.id' submission.json)
          echo "Notarization submission: $SUBMISSION_ID"

          DEADLINE=$((SECONDS + 45 * 60))
          while true; do
            if xcrun notarytool info "$SUBMISSION_ID" "${AUTH[@]}" --output-format json > result.json; then
              STATUS=$(jq -r '.status' result.json)
              echo "Notarization status: $STATUS"
              [ "$STATUS" != "In Progress" ] && break
            else
              echo "::warning::Couldn't fetch the notarization status; trying again"
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Notarization still not finished after 45 minutes (submission $SUBMISSION_ID)"
              exit 1
            fi
            sleep 30
          done

          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}" || true
            echo "::error::Notarization finished with status $STATUS"
            exit 1
          fi

          retry xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          spctl -a -vv "$bundle"
          rm NotarizeApp.zip submission.json result.json
          echo "App notarized and stapled"

      - name: Create the DMG and app zip
        env:
          PREVIEW_NAME: ${{ inputs.preview_name }}
        run: |
          set -euo pipefail
          scripts/create-dmg.sh "Zmail Preview.app" "Zmail-${PREVIEW_NAME}.dmg" "Zmail Preview ${PREVIEW_NAME}"
          ditto -c -k --sequesterRsrc --keepParent "Zmail Preview.app" "Zmail-${PREVIEW_NAME}.app.zip"
          shasum -a 256 "Zmail-${PREVIEW_NAME}.dmg" "Zmail-${PREVIEW_NAME}.app.zip" > "SHA256SUMS-${PREVIEW_NAME}"
          cat "SHA256SUMS-${PREVIEW_NAME}"

      - name: Clean up the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmail-${{ inputs.preview_name }}
          path: |
            Zmail-${{ inputs.preview_name }}.dmg
            Zmail-${{ inputs.preview_name }}.app.zip
            SHA256SUMS-${{ inputs.preview_name }}

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          PREVIEW_REF: ${{ inputs.ref }}
          PREVIEW_NOTES: ${{ inputs.notes }}
          PREVIEW_SHA: ${{ steps.source.outputs.sha }}
          GPUI_SOURCE: ${{ steps.source.outputs.gpui_source }}
        run: |
          set -euo pipefail
          {
            if [ -n "$PREVIEW_NOTES" ]; then
              printf '%s\n\n' "$PREVIEW_NOTES"
            fi
            cat <<NOTES
          > [!WARNING]
          > **Preview build, not a release.** Built from \`${PREVIEW_REF}\` at ${PREVIEW_SHA} for testing only. It may be unreviewed and is not supported; normal releases are the ones marked "Latest".

          - Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${PREVIEW_SHA}
          - GPUI: \`${GPUI_SOURCE}\`
          - The app is "Zmail Preview" (bundle identifier \`ie.unicornops.zmail.preview\`) and installs next to Zmail, but it opens the **same local store, settings and keychain entries** as Zmail. Quit Zmail before starting it.
          - Assets: \`Zmail-${PREVIEW_NAME}.dmg\` (Developer ID signed and notarized app), \`Zmail-${PREVIEW_NAME}.app.zip\`, and their SHA-256 sums.
          NOTES
          } > preview-notes.md
          gh release create "$PREVIEW_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PREVIEW_SHA" \
            --title "Zmail preview: ${PREVIEW_NAME}" \
            --notes-file preview-notes.md \
            --prerelease \
            --latest=false \
            "Zmail-${PREVIEW_NAME}.dmg" \
            "Zmail-${PREVIEW_NAME}.app.zip" \
            "SHA256SUMS-${PREVIEW_NAME}"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${PREVIEW_NAME}" >> "$GITHUB_STEP_SUMMARY"
