name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['crates/zmail-app--release_created'] }}
      release_sha: ${{ steps.release.outputs['crates/zmail-app--sha'] }}
      tag_name: ${{ steps.release.outputs['crates/zmail-app--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build_release_assets:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: zmail-linux-x86_64
            artifact_path: zmail-linux-x86_64.tar.gz
            binary_name: zmail-app
          - os: macos-latest
            archive_name: zmail-macos
            artifact_path: zmail-macos.tar.gz
            binary_name: zmail-app
          - os: windows-latest
            archive_name: zmail-windows-x86_64
            artifact_path: zmail-windows-x86_64.zip
            binary_name: zmail-app.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.94.0

      - name: Build release binary
        run: cargo build -p zmail-app --release --locked

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.artifact_path }}" -C target/release "${{ matrix.binary_name }}"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_path }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.artifact_path }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release_please.outputs.tag_name }}" "${{ matrix.artifact_path }}" --clobber
