name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['crates/zmail-app--release_created'] }}
      release_sha: ${{ steps.release.outputs['crates/zmail-app--sha'] }}
      tag_name: ${{ steps.release.outputs['crates/zmail-app--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  release_screenshot:
    name: Release Screenshot
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}

      - name: Install Linux build and capture dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libgl1 libegl1 libgl1-mesa-dri mesa-vulkan-drivers xvfb openbox xdotool imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.94.0

      - name: Build release binary
        run: cargo build -p zmail-app --release --locked

      - name: Capture Linux screenshot
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" bash scripts/capture-release-screenshot.sh artifacts/zmail-linux-screenshot.png

      - name: Upload capture logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmail-linux-screenshot-logs
          path: |
            /tmp/zmail-release-screenshot-app.log
            /tmp/zmail-release-screenshot-openbox.log
          if-no-files-found: ignore

      - name: Upload screenshot release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release_please.outputs.tag_name }}" artifacts/zmail-linux-screenshot.png --clobber

  build_release_assets:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: zmail-linux-x86_64
            artifact_path: zmail-linux-x86_64.tar.gz
            binary_name: zmail-app
          - os: macos-latest
            archive_name: zmail-macos
            artifact_path: zmail-macos.tar.gz
            binary_name: zmail-app
          - os: windows-latest
            archive_name: zmail-windows-x86_64
            artifact_path: zmail-windows-x86_64.zip
            binary_name: zmail-app.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.94.0

      - name: Build release binary
        run: cargo build -p zmail-app --release --locked

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.artifact_path }}" -C target/release "${{ matrix.binary_name }}"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_path }}"

      # Opt-in Authenticode signing: the steps no-op until the repository
      # secrets carry a certificate (see docs/phase5-hardening.md).
      - name: Decode signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/cert.pfx", [Convert]::FromBase64String("$env:WINDOWS_SIGNING_CERT"))
      - name: Sign the Windows artifacts
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:RUNNER_TEMP/cert.pfx", "$env:WINDOWS_SIGNING_PASSWORD")
          $signTool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Select-Object -Last 1).FullName
          & $signTool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f "$env:RUNNER_TEMP/cert.pfx" /p "$env:WINDOWS_SIGNING_PASSWORD" "target/release/${{ matrix.binary_name }}" "${{ matrix.artifact_path }}"

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo install cargo-wix --locked
          cargo wix -p zmail-app --no-build --nocapture
          mv target/wix/*.msi zmail-windows-x86_64.msi

      - name: Create Linux package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          # cargo-deb builds with the release profile by default and rejects
          # a second --release; --locked keeps the Cargo.lock authoritative.
          cargo deb -p zmail-app --locked
          mv target/debian/*.deb zmail-linux-x86_64.deb

      - name: Create macOS app bundle
        if: runner.os == 'macOS'
        run: |
          bundle="Zmail.app"
          mkdir -p "${bundle}/Contents/MacOS" "${bundle}/Contents/Resources"
          cp "target/release/${{ matrix.binary_name }}" "${bundle}/Contents/MacOS/Zmail"
          cat > "${bundle}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Zmail</string>
            <key>CFBundleIdentifier</key><string>ie.unicornops.zmail</string>
            <key>CFBundleName</key><string>Zmail</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.release_please.outputs.tag_name }}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key><string>Email address</string>
                <key>CFBundleURLSchemes</key>
                <array><string>mailto</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature for local execution; Developer ID signing and
          # notarization remain repository-controlled release work.
          codesign --force --sign - "${bundle}" || true
          ditto -c -k --sequesterRsrc --keepParent "${bundle}" zmail-macos.app.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.artifact_path }}
            zmail-linux-x86_64.deb
            zmail-macos.app.zip

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets="${{ matrix.artifact_path }}"
          if [[ "${{ runner.os }}" == "Linux" && -f zmail-linux-x86_64.deb ]]; then
            assets="$assets zmail-linux-x86_64.deb"
          fi
          if [[ "${{ runner.os }}" == "macOS" && -f zmail-macos.app.zip ]]; then
            assets="$assets zmail-macos.app.zip"
          fi
          if [[ "${{ runner.os }}" == "Windows" && -f zmail-windows-x86_64.msi ]]; then
            assets="$assets zmail-windows-x86_64.msi"
          fi
          sha256sum $assets > "SHA256SUMS-${{ runner.os }}"
          gh release upload "${{ needs.release_please.outputs.tag_name }}" $assets "SHA256SUMS-${{ runner.os }}" --clobber
