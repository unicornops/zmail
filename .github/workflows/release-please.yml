name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to rebuild and upload (e.g. v0.6.0), or with dry_run any tag or branch to build - skips release-please and runs the asset build only"
        required: true
        type: string
      dry_run:
        description: "Build, sign, notarize, and create the DMG without uploading or attesting anything (for testing release changes)"
        required: false
        type: boolean
        default: false

# Read-only by default. Only release-please, the release PR job and
# publish_release_assets write; the jobs that compile the dependency tree
# and install tools (build_release_assets, release_screenshot) hold a
# read-only token and hand their files over as workflow artefacts.
permissions:
  contents: read

jobs:
  release_please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['crates/zmail-app--release_created'] }}
      release_sha: ${{ steps.release.outputs['crates/zmail-app--sha'] }}
      tag_name: ${{ steps.release.outputs['crates/zmail-app--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  complete_release_changelog:
    name: Complete Release Changelog
    needs: release_please
    if: github.event_name == 'push' && needs.release_please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Render or complete the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: scripts/render-release-pr.sh

  # What to build and where it goes: the tag release-please just created,
  # or a manual run's tag_name. Anything that will be uploaded must be a
  # release tag (vX.Y.Z) with an existing release, and is checked out as
  # refs/tags/<tag>; a dry run may build any tag or branch, since it
  # uploads nothing.
  release_target:
    name: Release Target
    needs: release_please
    if: |
      !cancelled() &&
      (needs.release_please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      ref: ${{ steps.target.outputs.ref }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - name: Resolve and check the release tag
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release_please.outputs.release_sha }}
          INPUT_TAG: ${{ inputs.tag_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$RELEASE_TAG"
            ref="$RELEASE_SHA"
            publish=true
          elif [ "$DRY_RUN" = "true" ]; then
            tag="$INPUT_TAG"
            ref="$INPUT_TAG"
            publish=false
          else
            tag="$INPUT_TAG"
            ref="refs/tags/$INPUT_TAG"
            publish=true
          fi
          # Every value lands in GITHUB_OUTPUT and in checkout's ref, so
          # even a dry run's branch name must be a plain ref name.
          if [[ ! "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::The tag or branch to build is not a plain ref name:"
            printf '%q\n' "$ref"
            exit 1
          fi
          if [ "$publish" = "true" ]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Only a release tag (vX.Y.Z) can be uploaded; use dry_run to build anything else:"
              printf '%q\n' "$tag"
              exit 1
            fi
            gh release view "$tag" --json tagName --jq .tagName
          fi
          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Building $ref (upload to a release: $publish)"

  release_screenshot:
    name: Release Screenshot
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.release_sha }}
          persist-credentials: false

      # GPUI renders through wgpu, which loads the Vulkan loader (libvulkan1)
      # and, failing that, EGL/GL at runtime; mesa-vulkan-drivers supplies
      # the lavapipe software Vulkan driver the headless capture uses.
      - name: Install Linux build and capture dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libvulkan1 libgl1 libegl1 libgl1-mesa-dri mesa-vulkan-drivers xvfb openbox xdotool imagemagick

      - name: Read the pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Cargo git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git/db
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-git-${{ runner.os }}-

      - name: Build release binary
        run: cargo build -p zmail-app --release --locked

      - name: Capture Linux screenshot
        env:
          # Optional Docker Hub credentials for the harness image pulls
          # (issue #88); the script logs in only when both are set.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" bash scripts/capture-release-screenshot.sh artifacts/zmail-linux-screenshot.png

      - name: Upload capture logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zmail-linux-screenshot-logs
          path: |
            /tmp/zmail-release-screenshot-app.log
            /tmp/zmail-release-screenshot-openbox.log
          if-no-files-found: ignore

      - name: Upload the screenshot for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zmail-linux-screenshot
          path: artifacts/zmail-linux-screenshot.png
          if-no-files-found: error

  build_release_assets:
    needs: release_target
    if: ${{ !cancelled() && needs.release_target.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: zmail-linux-x86_64
            artifact_path: zmail-linux-x86_64.tar.gz
            binary_name: zmail-app
          - os: macos-latest
            archive_name: zmail-macos
            artifact_path: zmail-macos.tar.gz
            binary_name: zmail-app
          - os: windows-latest
            archive_name: zmail-windows-x86_64
            artifact_path: zmail-windows-x86_64.zip
            binary_name: zmail-app.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run builds the tag it was started with; otherwise the
          # release tag's commit.
          ref: ${{ needs.release_target.outputs.ref }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Read the pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Cargo git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git/db
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-git-${{ runner.os }}-

      # SQLCipher's vendored OpenSSL (ADR 0005) needs NASM for its AES-NI
      # code: OPENSSL_RUST_USE_NASM=1 fails the build without it instead of
      # falling back to slow C. Configure must run under Strawberry Perl, not
      # Git's MSYS Perl.
      - name: Install NASM for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_RUST_USE_NASM=1"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe"

      - name: Build release binary
        run: cargo build -p zmail-app --release --locked

      # The archives carry zmail's licence and the notices that must travel
      # with every copy of what the binary embeds: the Inter font's SIL OFL
      # 1.1 (Linux builds), Lucide's ISC/MIT, the Apache-2.0 licence of
      # the code ported from GPUI, SQLCipher's BSD-3-Clause and, where it
      # is linked (Linux and Windows), OpenSSL's Apache-2.0.
      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p archive/licenses
          cp "target/release/${{ matrix.binary_name }}" LICENSE archive/
          cp assets/fonts/inter/LICENSE.txt archive/licenses/Inter-OFL.txt
          cp assets/icons/LICENSE.txt archive/licenses/Lucide-LICENSE.txt
          cp crates/zmail-ui/LICENSE-APACHE archive/licenses/GPUI-Apache-2.0.txt
          cp crates/zmail-store/LICENSE-SQLCIPHER archive/licenses/SQLCipher-LICENSE.txt
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp crates/zmail-store/LICENSE-OPENSSL archive/licenses/OpenSSL-LICENSE.txt
          fi
          tar -czf "${{ matrix.artifact_path }}" -C archive .

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force archive/licenses | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}", LICENSE archive/
          Copy-Item assets/fonts/inter/LICENSE.txt archive/licenses/Inter-OFL.txt
          Copy-Item assets/icons/LICENSE.txt archive/licenses/Lucide-LICENSE.txt
          Copy-Item crates/zmail-ui/LICENSE-APACHE archive/licenses/GPUI-Apache-2.0.txt
          Copy-Item crates/zmail-store/LICENSE-SQLCIPHER archive/licenses/SQLCipher-LICENSE.txt
          Copy-Item crates/zmail-store/LICENSE-OPENSSL archive/licenses/OpenSSL-LICENSE.txt
          Compress-Archive -Path archive/* -DestinationPath "${{ matrix.artifact_path }}"

      # Opt-in Authenticode signing: the steps no-op until the repository
      # secrets carry a certificate (see docs/phase5-hardening.md).
      - name: Decode signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/cert.pfx", [Convert]::FromBase64String("$env:WINDOWS_SIGNING_CERT"))
      - name: Sign the Windows artifacts
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:RUNNER_TEMP/cert.pfx", "$env:WINDOWS_SIGNING_PASSWORD")
          $signTool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Select-Object -Last 1).FullName
          & $signTool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f "$env:RUNNER_TEMP/cert.pfx" /p "$env:WINDOWS_SIGNING_PASSWORD" "target/release/${{ matrix.binary_name }}" "${{ matrix.artifact_path }}"

      # The packaging tools are pinned (bump by hand): they run with this
      # job's token and, on macOS, before the signing certificate exists.
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo install cargo-wix --version 0.3.9 --locked
          cargo wix -p zmail-app --no-build --nocapture
          mv target/wix/*.msi zmail-windows-x86_64.msi

      - name: Create Linux package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          # cargo-deb builds with the release profile by default and rejects
          # a second --release; --locked keeps the Cargo.lock authoritative.
          cargo deb -p zmail-app --locked
          mv target/debian/*.deb zmail-linux-x86_64.deb

      # Everything that installs or runs third-party code on macOS (Homebrew,
      # the icon tools) happens before the Developer ID certificate is
      # imported; after it only codesign, the notary tools and our own DMG
      # script run.
      - name: Install the icon generation dependency
        if: runner.os == 'macOS'
        run: brew install librsvg

      - name: Generate the app icon
        if: runner.os == 'macOS'
        run: scripts/generate-app-icon.sh target/Zmail.icns target/Assets.car

      - name: Create macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle="Zmail.app"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zmail-app/Cargo.toml | head -n 1)
          echo "Bundling Zmail ${VERSION}"
          mkdir -p "${bundle}/Contents/MacOS" "${bundle}/Contents/Resources"
          cp "target/release/${{ matrix.binary_name }}" "${bundle}/Contents/MacOS/Zmail"
          cp target/Zmail.icns "${bundle}/Contents/Resources/Zmail.icns"
          cp target/Assets.car "${bundle}/Contents/Resources/Assets.car"
          cat > "${bundle}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleExecutable</key><string>Zmail</string>
            <key>CFBundleIdentifier</key><string>ie.unicornops.zmail</string>
            <key>CFBundleName</key><string>Zmail</string>
            <key>CFBundleDisplayName</key><string>Zmail</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>Zmail</string>
            <key>CFBundleIconName</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key><string>Email address</string>
                <key>CFBundleURLSchemes</key>
                <array><string>mailto</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          # The icon must resolve both ways: CFBundleIconName through the
          # compiled asset catalog (what recent macOS, notifications
          # included, uses) and CFBundleIconFile through the icns.
          plutil -lint "${bundle}/Contents/Info.plist"
          assetutil --info "${bundle}/Contents/Resources/Assets.car" > assets-info.json
          if ! grep -Eq '"Name" *: *"AppIcon"' assets-info.json; then
            cat assets-info.json
            echo "::error::Assets.car has no AppIcon"
            exit 1
          fi
          rm assets-info.json

      - name: Set up macOS code signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_BASE64" ]; then
            # No certificate configured: fall back to an ad-hoc signature
            # (see docs/phase5-hardening.md). The release must never block
            # on absent signing credentials.
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice::No Developer ID certificate configured; the macOS bundle falls back to an ad-hoc signature."
            exit 0
          fi

          KEYCHAIN_NAME="zmail-build.keychain"
          KEYCHAIN_PASSWORD="temporary_password_$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | sed s/\"//g)

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_NAME" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep -c "Developer ID Application" || echo "0")
          if [ "$IDENTITY_COUNT" -eq "0" ]; then
            echo "::error::No Developer ID Application certificate found after import"
            exit 1
          fi
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')

          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "Developer ID certificate installed"

      - name: Sign the macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle="Zmail.app"
          # Developer ID signature with the hardened runtime and a secure
          # timestamp so the bundle can notarize; an ad-hoc signature only
          # when no certificate is configured.
          if [ -n "${SIGNING_IDENTITY:-}" ] && [ "${SIGNING_IDENTITY}" != "-" ]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
            codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_NAME" --options runtime --timestamp "${bundle}"
            codesign -vvv --deep --strict "${bundle}"
          else
            codesign --force --sign - "${bundle}" || true
          fi
          ditto -c -k --sequesterRsrc --keepParent "${bundle}" zmail-macos.app.zip

      - name: Notarize the macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_IDENTITY:-}" ] || [ "${SIGNING_IDENTITY}" = "-" ]; then
            echo "::notice::Skipping notarization: the bundle has no Developer ID signature."
            exit 0
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::Skipping notarization: APPLE_DEVELOPER_ID, APPLE_APP_PASSWORD, or APPLE_TEAM_ID is not configured."
            exit 0
          fi

          bundle="Zmail.app"
          ditto -c -k --keepParent "$bundle" NotarizeApp.zip
          AUTH=(--apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD")

          # Apple's notary service drops the odd request, and
          # `notarytool submit --wait` gives up on the first one; submit with
          # retries and poll the submission's status, tolerating failed polls.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::Notarization attempt $attempt failed: $*"
              sleep $((attempt * 30))
            done
            return 1
          }
          submit() {
            xcrun notarytool submit NotarizeApp.zip "${AUTH[@]}" --output-format json > submission.json
          }

          retry submit
          SUBMISSION_ID=$(jq -r '.id' submission.json)
          echo "Notarization submission: $SUBMISSION_ID"

          DEADLINE=$((SECONDS + 45 * 60))
          while true; do
            if xcrun notarytool info "$SUBMISSION_ID" "${AUTH[@]}" --output-format json > result.json; then
              STATUS=$(jq -r '.status' result.json)
              echo "Notarization status: $STATUS"
              [ "$STATUS" != "In Progress" ] && break
            else
              echo "::warning::Couldn't fetch the notarization status; trying again"
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Notarization still not finished after 45 minutes (submission $SUBMISSION_ID)"
              exit 1
            fi
            sleep 30
          done

          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}" || true
            echo "::error::Notarization finished with status $STATUS"
            exit 1
          fi

          retry xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          spctl -a -vv "$bundle"
          rm NotarizeApp.zip submission.json result.json
          echo "App notarized and stapled"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zmail-app/Cargo.toml | head -n 1)
          scripts/create-dmg.sh "Zmail.app" "Zmail-${VERSION}.dmg" "Zmail ${VERSION}"

      - name: Clean up the macOS keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ] && [ -n "${SIGNING_IDENTITY:-}" ] && [ "${SIGNING_IDENTITY}" != "-" ]; then
            security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          fi

      # publish_release_assets takes the release assets from this artefact.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.artifact_path }}
            zmail-linux-x86_64.deb
            zmail-macos.app.zip
            Zmail-*.dmg
            zmail-windows-x86_64.msi
          if-no-files-found: error

  # The only job that can write to a release. It runs no project or
  # dependency code: it takes the built files from the artefacts, writes
  # SHA256SUMS-<OS> for each platform, attests every asset's build
  # provenance and uploads them. A platform whose build failed is left out
  # and the job fails after uploading the rest, so "Re-run failed jobs"
  # (or release-backfill.yml for Windows) completes the release. A dry run
  # stops after the checksums.
  #
  # Verify a downloaded asset with the GitHub CLI:
  #   gh attestation verify zmail-linux-x86_64.deb --repo unicornops/zmail
  publish_release_assets:
    name: Publish Release Assets
    needs: [release_target, build_release_assets, release_screenshot]
    if: ${{ !cancelled() && needs.release_target.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the build artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Collect the release assets and write the checksums
        id: collect
        env:
          BUILD_RESULT: ${{ needs.build_release_assets.result }}
          SCREENSHOT_RESULT: ${{ needs.release_screenshot.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release
          incomplete=false
          # collect OS ARTEFACT FILE...: every FILE (a glob matching one
          # file) or nothing from that platform.
          collect() {
            local os="$1" dir="dist/$2" pattern
            local -a files=() match
            shift 2
            if [ ! -d "$dir" ]; then
              echo "::error::No $os build artefact; its assets are not published"
              incomplete=true
              return 0
            fi
            for pattern in "$@"; do
              # shellcheck disable=SC2206 # the pattern is meant to glob
              match=("$dir"/$pattern)
              if [ "${#match[@]}" -ne 1 ] || [ ! -f "${match[0]}" ]; then
                echo "::error::$os: expected one $pattern; its assets are not published"
                incomplete=true
                return 0
              fi
              files+=("${match[0]##*/}")
            done
            (cd "$dir" && sha256sum "${files[@]}") > "release/SHA256SUMS-$os"
            for pattern in "${files[@]}"; do
              cp "$dir/$pattern" release/
            done
          }
          collect Linux zmail-linux-x86_64 zmail-linux-x86_64.tar.gz zmail-linux-x86_64.deb
          collect macOS zmail-macos zmail-macos.tar.gz zmail-macos.app.zip 'Zmail-*.dmg'
          collect Windows zmail-windows-x86_64 zmail-windows-x86_64.zip zmail-windows-x86_64.msi
          # Only a release-please run takes a screenshot.
          if [ "$SCREENSHOT_RESULT" != "skipped" ]; then
            if [ -f dist/zmail-linux-screenshot/zmail-linux-screenshot.png ]; then
              cp dist/zmail-linux-screenshot/zmail-linux-screenshot.png release/
            else
              echo "::error::No release screenshot; it is not published"
              incomplete=true
            fi
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            incomplete=true
          fi
          files=(release/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Nothing was built"
            exit 1
          fi
          (cd release && sha256sum -- *)
          echo "incomplete=$incomplete" >> "$GITHUB_OUTPUT"

      # One provenance attestation for every file uploaded below, signed
      # with this run's OIDC identity (Sigstore) and stored by GitHub.
      - name: Attest the release assets
        if: needs.release_target.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Upload the release assets
        if: needs.release_target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release_target.outputs.tag }}
        run: gh release upload "$TAG" release/* --clobber

      - name: Fail when a platform is missing
        if: steps.collect.outputs.incomplete == 'true'
        run: |
          echo "::error::Not every platform's assets were built; see the errors above"
          exit 1
