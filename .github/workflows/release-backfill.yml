name: Release Asset Backfill

# Rebuilds and uploads the Windows release assets (zip, MSI, checksums)
# for an existing tagged release. Used when a release job failed after
# the other assets were already published.
on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "The existing tag to rebuild Windows assets for (e.g. v0.4.0)"
                required: true
                type: string

permissions:
    contents: write

jobs:
    backfill-windows-assets:
        runs-on: windows-latest
        steps:
            - name: Checkout release commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.release_tag }}

            # The tag's own rust-toolchain.toml names the toolchain it was
            # released with.
            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}

            # SQLCipher's vendored OpenSSL (ADR 0005) needs NASM for its AES-NI
            # code: OPENSSL_RUST_USE_NASM=1 fails the build without it instead of
            # falling back to slow C. Configure must run under Strawberry Perl, not
            # Git's MSYS Perl.
            - name: Install NASM for OpenSSL
              shell: pwsh
              run: |
                  choco install nasm --no-progress -y
                  Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
                  Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_RUST_USE_NASM=1"
                  Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe"

            - name: Build release binary
              run: cargo build -p zmail-app --release --locked

            - name: Create Windows archive
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force archive/licenses | Out-Null
                  Copy-Item "target/release/zmail-app.exe", LICENSE archive/
                  Copy-Item assets/fonts/inter/LICENSE.txt archive/licenses/Inter-OFL.txt
                  Copy-Item assets/icons/LICENSE.txt archive/licenses/Lucide-LICENSE.txt
                  Copy-Item crates/zmail-ui/LICENSE-APACHE archive/licenses/GPUI-Apache-2.0.txt
                  # Releases from before store encryption (ADR 0005) have neither.
                  foreach ($notice in @("SQLCIPHER:SQLCipher", "OPENSSL:OpenSSL")) {
                      $source, $name = $notice -split ":"
                      if (Test-Path "crates/zmail-store/LICENSE-$source") {
                          Copy-Item "crates/zmail-store/LICENSE-$source" "archive/licenses/$name-LICENSE.txt"
                      }
                  }
                  Compress-Archive -Path archive/* -DestinationPath "zmail-windows-x86_64.zip"

            - name: Create Windows installer
              shell: bash
              run: |
                  cargo install cargo-wix --locked
                  cargo wix -p zmail-app --no-build --nocapture
                  mv target/wix/*.msi zmail-windows-x86_64.msi

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  sha256sum zmail-windows-x86_64.zip zmail-windows-x86_64.msi > SHA256SUMS-Windows
                  gh release upload "${{ inputs.release_tag }}" zmail-windows-x86_64.zip zmail-windows-x86_64.msi SHA256SUMS-Windows --clobber
