name: Release Asset Backfill

# Rebuilds and uploads the Windows release assets (zip, MSI, checksums)
# for an existing tagged release. Used when a release job failed after
# the other assets were already published.
on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "The existing tag to rebuild Windows assets for (e.g. v0.4.0)"
                required: true
                type: string

# Read-only by default: the build compiles the dependency tree and installs
# cargo-wix with a read-only token, and only publish-windows-assets can
# write to the release (as in release-please.yml).
permissions:
    contents: read

jobs:
    backfill-windows-assets:
        runs-on: windows-latest
        steps:
            - name: Check the release tag
              shell: bash
              env:
                  RELEASE_TAG: ${{ inputs.release_tag }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::release_tag must be a release tag (vX.Y.Z):"
                      printf '%q\n' "$RELEASE_TAG"
                      exit 1
                  fi
                  gh release view "$RELEASE_TAG" --json tagName --jq .tagName

            - name: Checkout release commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ inputs.release_tag }}
                  persist-credentials: false

            # The tag's own rust-toolchain.toml names the toolchain it was
            # released with.
            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}

            # SQLCipher's vendored OpenSSL (ADR 0005) needs NASM for its AES-NI
            # code: OPENSSL_RUST_USE_NASM=1 fails the build without it instead of
            # falling back to slow C. Configure must run under Strawberry Perl, not
            # Git's MSYS Perl.
            - name: Install NASM for OpenSSL
              shell: pwsh
              run: |
                  choco install nasm --no-progress -y
                  Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
                  Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_RUST_USE_NASM=1"
                  Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe"

            - name: Build release binary
              run: cargo build -p zmail-app --release --locked

            - name: Create Windows archive
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force archive/licenses | Out-Null
                  Copy-Item "target/release/zmail-app.exe", LICENSE archive/
                  Copy-Item assets/fonts/inter/LICENSE.txt archive/licenses/Inter-OFL.txt
                  Copy-Item assets/icons/LICENSE.txt archive/licenses/Lucide-LICENSE.txt
                  Copy-Item crates/zmail-ui/LICENSE-APACHE archive/licenses/GPUI-Apache-2.0.txt
                  # Releases from before store encryption (ADR 0005) have neither.
                  foreach ($notice in @("SQLCIPHER:SQLCipher", "OPENSSL:OpenSSL")) {
                      $source, $name = $notice -split ":"
                      if (Test-Path "crates/zmail-store/LICENSE-$source") {
                          Copy-Item "crates/zmail-store/LICENSE-$source" "archive/licenses/$name-LICENSE.txt"
                      }
                  }
                  Compress-Archive -Path archive/* -DestinationPath "zmail-windows-x86_64.zip"

            # Pinned like release-please.yml's (bump by hand).
            - name: Create Windows installer
              shell: bash
              run: |
                  cargo install cargo-wix --version 0.3.9 --locked
                  cargo wix -p zmail-app --no-build --nocapture
                  mv target/wix/*.msi zmail-windows-x86_64.msi

            - name: Upload workflow artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: zmail-windows-x86_64
                  path: |
                      zmail-windows-x86_64.zip
                      zmail-windows-x86_64.msi
                  if-no-files-found: error

    # Checksums, provenance attestation and upload, as in release-please.yml's
    # publish_release_assets. Verify with:
    #   gh attestation verify zmail-windows-x86_64.msi --repo unicornops/zmail
    publish-windows-assets:
        needs: backfill-windows-assets
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - name: Download the build artefact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: zmail-windows-x86_64
                  path: release

            - name: Write the checksums
              working-directory: release
              run: |
                  set -euo pipefail
                  sha256sum zmail-windows-x86_64.zip zmail-windows-x86_64.msi > SHA256SUMS-Windows
                  cat SHA256SUMS-Windows

            - name: Attest the release assets
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: release/*

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: gh release upload "$RELEASE_TAG" release/zmail-windows-x86_64.zip release/zmail-windows-x86_64.msi release/SHA256SUMS-Windows --clobber
