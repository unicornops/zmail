name: Fuzz

# Keeps the mail parsing fuzz targets (fuzz/README.md) building and fuzzes
# them briefly: on pull requests that change them, zmail's parsing path
# (zmail-imap, zmail-core, zmail-security) or the mail-parser, encodify or
# simdutf8 versions in Cargo.lock; on main after such a change; and weekly.
on:
    push:
        branches: [main]
        paths:
            - fuzz/**
            - crates/zmail-imap/**
            - crates/zmail-core/**
            - crates/zmail-security/**
            - Cargo.lock
            - .github/workflows/fuzz.yml
    pull_request:
        paths:
            - fuzz/**
            - crates/zmail-imap/**
            - crates/zmail-core/**
            - crates/zmail-security/**
            - Cargo.lock
            - .github/workflows/fuzz.yml
    schedule:
        - cron: "17 4 * * 3"
    workflow_dispatch:

concurrency:
    group: fuzz-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    # Seconds of fuzzing per target; the two targets run side by side.
    FUZZ_SECONDS: 300

jobs:
    fuzz:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            # A Cargo.lock change counts only when it moves one of the
            # parsing crates; anything else under the path filters runs.
            - name: Decide whether to fuzz
              id: decide
              shell: bash
              run: |
                  versions() {
                    git show "$1:Cargo.lock" 2>/dev/null \
                      | awk '/^name = "(mail-parser|encodify|simdutf8)"$/ { name = $3; getline; print name, $3 }'
                  }
                  run=true
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    base="${{ github.event.pull_request.base.sha }}"
                    head="${{ github.event.pull_request.head.sha }}"
                  elif [[ "${{ github.event_name }}" == "push" ]]; then
                    base="${{ github.event.before }}"
                    head="${{ github.sha }}"
                  fi
                  if [[ -n "${base:-}" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
                    others=$(git diff --name-only "$base" "$head" | grep -v '^Cargo.lock$' \
                      | grep -E '^(fuzz/|crates/zmail-(imap|core|security)/|\.github/workflows/fuzz\.yml$)' || true)
                    if [[ -z "$others" && "$(versions "$base")" == "$(versions "$head")" ]]; then
                      run=false
                      echo "Only Cargo.lock changed, and not mail-parser, encodify or simdutf8: skipping."
                    fi
                  fi
                  echo "run=$run" >> "$GITHUB_OUTPUT"

            - name: Install Linux build dependencies
              if: steps.decide.outputs.run == 'true'
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

            # AddressSanitizer's shadow memory does not fit the address space
            # layout of runners with 32 bits of mmap randomisation.
            - name: Lower mmap randomisation for AddressSanitizer
              if: steps.decide.outputs.run == 'true'
              run: sudo sysctl -w vm.mmap_rnd_bits=28

            - name: Install Rust nightly
              if: steps.decide.outputs.run == 'true'
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: nightly
                  components: rustfmt

            - name: Install cargo-fuzz
              if: steps.decide.outputs.run == 'true'
              run: cargo install cargo-fuzz --version 0.13.2 --locked

            - name: Format
              if: steps.decide.outputs.run == 'true'
              run: cargo +nightly fmt --manifest-path fuzz/Cargo.toml -- --check

            # Linted with the workspace's pinned toolchain (rust-toolchain.toml),
            # like the rest of the code, before the next step touches the lock.
            - name: Read the pinned Rust toolchain
              if: steps.decide.outputs.run == 'true'
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install the pinned Rust
              if: steps.decide.outputs.run == 'true'
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}
                  components: clippy

            - name: Clippy
              if: steps.decide.outputs.run == 'true'
              run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

            # The targets fuzz the mail-parser and encodify the app ships, so
            # move fuzz/Cargo.lock to the app's versions when it lags behind.
            - name: Use the app's mail-parser and encodify
              if: steps.decide.outputs.run == 'true'
              shell: bash
              run: |
                  for crate in mail-parser encodify simdutf8; do
                    app=$(awk -v n="name = \"$crate\"" '$0 == n { getline; print $3 }' Cargo.lock | tr -d '"')
                    fuzz=$(awk -v n="name = \"$crate\"" '$0 == n { getline; print $3 }' fuzz/Cargo.lock | tr -d '"')
                    if [[ -n "$app" && "$app" != "$fuzz" ]]; then
                      echo "::notice::fuzz/Cargo.lock has $crate $fuzz, the app $app; fuzzing $app."
                      cargo +nightly update --manifest-path fuzz/Cargo.toml -p "$crate@$fuzz" --precise "$app"
                    fi
                  done

            - name: Build the fuzz targets
              if: steps.decide.outputs.run == 'true'
              timeout-minutes: 20
              working-directory: fuzz
              run: cargo +nightly fuzz build -O --debug-assertions

            - name: Replay the committed corpus
              if: steps.decide.outputs.run == 'true'
              timeout-minutes: 5
              working-directory: fuzz
              run: |
                  for target in zmail_parse encodify_decoders; do
                    cargo +nightly fuzz run -O --debug-assertions "$target" "corpus/$target" -- \
                      -runs=0 -timeout=10 -rss_limit_mb=2048
                  done

            # New inputs go to a scratch directory, so the committed corpus
            # only seeds. A crash, a 10 s input or 2 GB fails the step.
            - name: Fuzz
              if: steps.decide.outputs.run == 'true'
              timeout-minutes: 10
              working-directory: fuzz
              shell: bash
              run: |
                  mkdir -p artifacts
                  pids=()
                  for target in zmail_parse encodify_decoders; do
                    mkdir -p "artifacts/$target" "$RUNNER_TEMP/corpus-$target"
                    cargo +nightly fuzz run -O --debug-assertions "$target" \
                      "$RUNNER_TEMP/corpus-$target" "corpus/$target" -- \
                      -fork=2 -max_total_time="$FUZZ_SECONDS" -max_len=65536 \
                      -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=512 \
                      -artifact_prefix="artifacts/$target/" \
                      > "artifacts/$target.log" 2>&1 &
                    pids+=($!)
                  done
                  status=0
                  for pid in "${pids[@]}"; do
                    wait "$pid" || status=1
                  done
                  for target in zmail_parse encodify_decoders; do
                    echo "== $target"
                    grep -E '^#[0-9]+: cov' "artifacts/$target.log" | tail -n 1 || true
                    if [[ $status -ne 0 ]]; then tail -n 60 "artifacts/$target.log"; fi
                  done
                  exit $status

            - name: Upload crash artefacts
              if: failure() && steps.decide.outputs.run == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: fuzz-artifacts
                  path: fuzz/artifacts
                  if-no-files-found: ignore
