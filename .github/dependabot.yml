# Dependabot: weekly dependency and GitHub Actions updates. Security
# updates (for Dependabot alerts) are switched on in the repository
# settings and follow the same rules below.
#
# Commit messages stay Conventional Commits: Cargo updates are
# `fix(deps): ...` so release-please ships them, Actions updates are
# `ci(deps): ...`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The four git pins below are watched by the weekly git-pins
      # workflow instead (docs/upstream/git-pins.md).
      # GPUI is pinned to the head of Zed PR #62379 for the web renderer
      # (docs/upstream/zed.md); the zed-upstream workflow and manual pin
      # moves own it.
      - dependency-name: gpui
      - dependency-name: gpui_platform
      # Forks carrying the RustCrypto 0.14 / crypto-bigint 0.7 stack for
      # RUSTSEC-2026-0387 until rpgp/rpgp#573 and upstream proton-srp move
      # (deny.toml, Cargo.toml).
      - dependency-name: pgp
      - dependency-name: proton-srp

  # The fuzz targets' own lockfile (fuzz/README.md): one grouped pull
  # request a month. The parsing crates themselves move with the app's
  # Cargo.lock, which the fuzz workflow follows.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: test
      include: scope
    groups:
      fuzz:
        patterns:
          - "*"

  # The mail harness images (docker-compose.yml, dovecot/Dockerfile) are
  # pinned by tag and digest; Dependabot moves both together.
  - package-ecosystem: docker
    directory: /docker/mail-harness
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: test
      include: scope
    groups:
      mail-harness:
        patterns:
          - "*"

  # wrangler, which deploys the documentation site (docs/site.md), with its
  # lockfile. mdBook and lychee are pinned in
  # scripts/docs-site/install-tools.sh and bumped by hand.
  - package-ecosystem: npm
    directory: /scripts/docs-site/deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
      include: scope
    groups:
      docs-site-deploy:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
